name: test

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  node:
    name: node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # 三个文件分别执行：node --test 在某些受限环境会因为 spawn 子进程被拒而失败
      - run: node test/cleanup.test.js
      - run: node test/host.test.js
      - run: node test/client.test.js
